server {
    listen 80;
    server_name forum.starkdb.org;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://localhost:8080/api/;  # ← Changed from backend to localhost
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://localhost:8080/uploads/;  # ← Changed from backend to localhost
        proxy_set_header Host $host;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nAllow: /\nSitemap: https://forum.starkdb.org/sitemap.xml\n";
    }

    location = /sitemap.xml {
        add_header Content-Type application/xml;
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
    <url><loc>https://forum.starkdb.org/</loc><changefreq>daily</changefreq><priority>1.0</priority></url>
    <url><loc>https://forum.starkdb.org/privacy</loc><changefreq>monthly</changefreq><priority>0.3</priority></url>
    <url><loc>https://forum.starkdb.org/terms</loc><changefreq>monthly</changefreq><priority>0.3</priority></url>
</urlset>';
    }
}
